name: Security Audit (Prod)

on:
  push:
    branches:
      - main
      - master
  pull_request:

jobs:
  audit-prod:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Audit runtime dependencies
        run: npm audit --omit=dev

      - name: Type check
        run: npm run typecheck

      - name: Test request and offer notifications
        run: |
          node --import tsx scripts/test-telegram.ts
          node --import tsx scripts/test-bib-request-email.ts
          node --import tsx scripts/test-bib-offer-alert.ts

      - name: Build
        run: npm run build
